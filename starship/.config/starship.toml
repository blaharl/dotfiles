# ~/.config/starship.toml

# Get editor completions based on the config schema
# "$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
# add_newline = true

# Replace the '❯' symbol in the prompt with '➜'
# [character] # The name of the module we are configuring is 'character'
# success_symbol = '[➜](bold green)' # The 'success_symbol' segment is being set to '➜' with the color 'bold green'

# Disable the package module, hiding it from the prompt completely
# [package]
# disabled = true

palette = "cool"

format = """
[](red)\
$python\
$hostname\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
${custom.git_branch}\
${custom.git_status}\
${custom.jj}\
[](fg:yellow bg:green)\
$c\
$elixir\
$elm\
$golang\
$haskell\
$java\
$julia\
$nodejs\
$nim\
$rust\
[](fg:green bg:sapphire)\
$docker_context\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
"""
command_timeout = 5000
# Disable the blank line at the start of the prompt
# add_newline = false

[hostname]
ssh_only = true
ssh_symbol = '🌐'
trim_at = '.'
style = "bg:red fg:crust"
format = '[$ssh_symbol $hostname ]($style)'
disabled = false

# You can also replace your username with a neat symbol like  to save some space
[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[$user ]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
# format = "[$path]($style)[$lock_symbol]($lock_style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = "  "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important  " = "  "

[c]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:sapphire"
format = '[[ $symbol( $context) ](fg:crust bg:sapphire)]($style) $path'

[elixir]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

# custom module for jj status
[custom.jj]
description = "The current jj status"
when = "jj --ignore-working-copy root"
style = "fg:crust bg:yellow"
format = '[ $output ]($style)'
command = '''
jj log --revisions @ --no-graph --ignore-working-copy --color never --limit 1 --template '
  separate(" ",
    raw_escape_sequence("\x1b[1;35m") ++
      change_id.shortest(4) ++
    raw_escape_sequence("\x1b[1;37m"),
    if(bookmarks,
      raw_escape_sequence("\x1b[1;35m") ++
        bookmarks ++
      raw_escape_sequence("\x1b[1;37m"),
    ),
    "|",
    concat(
      if(conflict, "💥"),
      if(divergent, "🚧"),
      if(hidden, "👻"),
      if(immutable, "🔒"),
    ),
    if(empty,
      raw_escape_sequence("\x1b[1;32m") ++
        "(empty)" ++
      raw_escape_sequence("\x1b[1;37m"),
    ),
    raw_escape_sequence("\x1b[1;32m") ++
      coalesce(
        truncate_end(29, description.first_line(), "…"),
        "(no description set)",
      ) ++
    raw_escape_sequence("\x1b[1;37m"),
  )
'
'''

# optionally disable git modules when JJ is found.
# note that you'll need to add ${custom.git_branch}, ${custom.git_commit} etc
# into format: https://starship.rs/config/#default-prompt-format
[git_status]
disabled = true
# style = "bg:yellow"
# format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[custom.git_status]
when = "! jj --ignore-working-copy root"
command = "starship module git_status"
style = "bg:yellow"
description = "Only show git_status if we're not in a jj repo"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[git_commit]
disabled = true
# commit_hash_length = 8
# style = "bold white"

[custom.git_commit]
when = "! jj --ignore-working-copy root && git -C . rev-parse"
command = "starship module git_commit"
style = "bg:yellow"
description = "Only show git_commit if we're not in a jj repo"

[git_metrics]
disabled = true

[custom.git_metrics]
when = "! jj --ignore-working-copy root && git -C . rev-parse"
command = "starship module git_metrics"
description = "Only show git_metrics if we're not in a jj repo"
style = "bg:yellow"

[git_branch]
disabled = true
# symbol = ""
# style = "bg:yellow"
# format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[custom.git_branch]
when = "! jj --ignore-working-copy root && git -C . rev-parse"
command = "starship module git_branch"
description = "Only show git_branch if we're not in a jj repo"
style = "bg:yellow"
symbol = ""
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

[golang]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[nim]
symbol = " "
style = "bg:green"
format = '[ $symbol ($version) ]($style)'

[python]
style = "bg:red"
format = '[(\($virtualenv\) )]($style)'
# format = "[$symbol$version]($style) "

[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

